<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send a Tip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0D0F1A;
      --surface:   #161926;
      --surface2:  #1E2235;
      --border:    #2A2F4A;
      --violet:    #7C3AED;
      --violet-h:  #6D28D9;
      --teal:      #06D6A0;
      --text:      #F0F2FF;
      --muted:     #8890B5;
      --danger:    #F87171;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 48px;
    }

    /* ── LIVE badge ── */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--teal);
      margin-bottom: 28px;
    }

    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--teal);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px 36px;
      position: relative;
    }

    .card-glow {
      position: absolute;
      inset: -1px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--violet) 0%, transparent 50%, var(--teal) 100%);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }

    .card > *:not(.card-glow) { position: relative; z-index: 1; }

    /* ── Streamer header ── */
    .streamer-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--violet), var(--teal));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px; font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .streamer-info { flex: 1; }

    .streamer-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .streamer-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── Amount chips ── */
    .amounts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }

    .chip {
      flex: 1 1 calc(25% - 6px);
      min-width: 72px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .chip:hover { border-color: var(--violet); background: #251845; }

    .chip.selected {
      border-color: var(--violet);
      background: #251845;
      color: #C4B5FD;
    }

    .chip .sub { font-size: 11px; font-weight: 400; color: var(--muted); display: block; margin-top: 1px; }
    .chip.selected .sub { color: #A78BFA; }

    /* ── Custom amount ── */
    .custom-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .custom-wrap .rupee {
      position: absolute;
      left: 14px; top: 50%; transform: translateY(-50%);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px; font-weight: 600;
      color: var(--muted);
      pointer-events: none;
    }

    input[type="number"], input[type="text"], textarea {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      transition: border-color 0.15s;
      outline: none;
    }

    input[type="number"]:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--violet);
    }

    input[type="number"] {
      padding: 11px 14px 11px 32px;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* ── Fields ── */
    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 7px;
    }

    input[type="text"] { padding: 11px 14px; }

    textarea {
      padding: 11px 14px;
      resize: none;
      height: 72px;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Pay button ── */
    .pay-btn {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      background: var(--violet);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .pay-btn:hover { background: var(--violet-h); }
    .pay-btn:active { transform: scale(0.98); }
    .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .pay-btn .amount-preview { opacity: 0.75; font-weight: 500; }

    /* ── Error ── */
    .error-msg {
      font-size: 13px;
      color: var(--danger);
      margin-top: 10px;
      text-align: center;
      min-height: 20px;
    }

    /* ── Success overlay ── */
    .success-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 0 4px;
    }

    .success-overlay.visible { display: flex; }

    .success-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--violet), var(--teal));
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin-bottom: 20px;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .success-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px; font-weight: 700;
      margin-bottom: 8px;
    }

    .success-sub {
      font-size: 14px;
      color: var(--muted);
      max-width: 280px;
      margin-bottom: 24px;
    }

    .success-sub span { color: var(--teal); font-weight: 500; }

    .tip-again-btn {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 10px 22px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .tip-again-btn:hover { border-color: var(--violet); }

    /* ── UPI badge at bottom ── */
    .upi-note {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .upi-note strong { color: var(--text); font-weight: 500; }

    /* ── Video player ── */
    .player-wrap {
      margin-bottom: 20px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .player-tabs {
      display: flex;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    .ptab {
      flex: 1;
      padding: 9px 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.13s, background 0.13s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .ptab svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }
    .ptab.active        { color: var(--text); background: var(--surface); }
    .ptab.yt.active     { color: #FF4444; }
    .ptab.tw.active     { color: #9146FF; }
    .player-screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .player-screen iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation: none; }
      .success-icon { animation: none; }
    }

    @media (max-width: 400px) {
      .card { padding: 24px 18px 28px; }
      .chip { font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="live-badge">
    <span class="live-dot"></span>
    LIVE NOW
  </div>

  <div class="card" id="tipCard">
    <div class="card-glow"></div>

    <!-- Streamer header -->
    <div class="streamer-header">
      <div class="avatar" id="avatarEl">?</div>
      <div class="streamer-info">
        <div class="streamer-name" id="streamerNameEl">Loading...</div>
        <div class="streamer-sub">Send a tip — your message shows on stream</div>
      </div>
    </div>

    <!-- Live stream player -->
    <div class="player-wrap">
      <div class="player-tabs">
        <button class="ptab yt active" id="tabYt" onclick="switchTab('yt')">
          <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          YouTube
        </button>
        <button class="ptab tw" id="tabTw" onclick="switchTab('tw')">
          <svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
          Twitch
        </button>
      </div>
      <div class="player-screen">
        <!-- YouTube live stream embed (channel ID: UCu5LMkQhZdVlfNnoBso-nfg) -->
        <iframe
          id="ytFrame"
          src="https://www.youtube.com/embed/live_stream?channel=UCu5LMkQhZdVlfNnoBso-nfg&autoplay=0&rel=0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
        <!-- Twitch embed (hidden by default; parent domain set via JS) -->
        <iframe
          id="twFrame"
          style="display:none"
          allow="autoplay; fullscreen"
          allowfullscreen
        ></iframe>
      </div>
    </div>

    <!-- Main form -->
    <div id="formView">
      <div class="section-label">Choose amount</div>
      <div class="amounts" id="chipGroup">
        <button class="chip" data-amount="49">₹49<span class="sub">small</span></button>
        <button class="chip selected" data-amount="99">₹99<span class="sub">nice</span></button>
        <button class="chip" data-amount="199">₹199<span class="sub">big</span></button>
        <button class="chip" data-amount="499">₹499<span class="sub">legend</span></button>
      </div>

      <div class="custom-wrap">
        <span class="rupee">₹</span>
        <input type="number" id="customAmount" placeholder="Custom amount" min="1" />
      </div>

      <div class="field">
        <label for="donorName">Your name</label>
        <input type="text" id="donorName" placeholder="Anonymous" maxlength="40" />
      </div>

      <div class="field">
        <label for="donorMsg">Message <span style="font-weight:400;color:#5a6080">(shown on stream)</span></label>
        <textarea id="donorMsg" placeholder="Say something nice..." maxlength="200"></textarea>
      </div>

      <button class="pay-btn" id="payBtn">
        Pay via UPI &nbsp;<span class="amount-preview" id="amountPreview">₹99</span>
      </button>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- Success state -->
    <div class="success-overlay" id="successView">
      <div class="success-icon">🎉</div>
      <div class="success-title">Tip sent!</div>
      <div class="success-sub">
        Your alert is firing on stream right now. Thanks, <span id="successName">friend</span>!
      </div>
      <button class="tip-again-btn" id="tipAgainBtn">Send another tip</button>
    </div>
  </div>

  <div class="upi-note">
    Secured by <strong>Razorpay</strong> · UPI, cards &amp; wallets accepted
  </div>

<script>
  // ─── Config (injected from server) ───────────────────────────────────────
  const CONFIG = {
    razorpayKey: '__RAZORPAY_KEY__',    // replaced at serve time OR set directly
    streamerName: '__STREAMER_NAME__',
    currency: 'INR'
  };

  // ─── Tab switcher (YouTube / Twitch) ──────────────────────────────────────
  function switchTab(tab) {
    const ytFrame = document.getElementById('ytFrame');
    const twFrame = document.getElementById('twFrame');
    const tabYt   = document.getElementById('tabYt');
    const tabTw   = document.getElementById('tabTw');

    if (tab === 'yt') {
      ytFrame.style.display = '';
      twFrame.style.display = 'none';
      tabYt.classList.add('active');
      tabTw.classList.remove('active');
    } else {
      ytFrame.style.display = 'none';
      twFrame.style.display = '';
      tabTw.classList.add('active');
      tabYt.classList.remove('active');
      // Set Twitch src with correct parent domain on first switch
      if (!twFrame.src || twFrame.src === 'about:blank') {
        const parent = window.location.hostname || 'localhost';
        twFrame.src = `https://player.twitch.tv/?channel=gamedayislive&parent=${parent}&autoplay=false`;
      }
    }
  }

  // ─── Init ─────────────────────────────────────────────────────────────────
  const streamerName = CONFIG.streamerName !== '__STREAMER_NAME__'
    ? CONFIG.streamerName : 'Your Streamer';

  document.getElementById('streamerNameEl').textContent = streamerName;
  document.getElementById('avatarEl').textContent = streamerName.charAt(0).toUpperCase();

  // ─── Amount logic ─────────────────────────────────────────────────────────
  let selectedAmount = 99;

  function updatePreview(amount) {
    selectedAmount = amount;
    document.getElementById('amountPreview').textContent = '₹' + amount;
  }

  // Chips
  document.getElementById('chipGroup').addEventListener('click', e => {
    const chip = e.target.closest('[data-amount]');
    if (!chip) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
    document.getElementById('customAmount').value = '';
    updatePreview(parseInt(chip.dataset.amount));
  });

  // Custom amount
  document.getElementById('customAmount').addEventListener('input', e => {
    const val = parseInt(e.target.value);
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    if (val && val >= 1) updatePreview(val);
  });

  // ─── Pay ──────────────────────────────────────────────────────────────────
  document.getElementById('payBtn').addEventListener('click', async () => {
    const amount  = selectedAmount;
    const name    = document.getElementById('donorName').value.trim() || 'Anonymous';
    const message = document.getElementById('donorMsg').value.trim();
    const errEl   = document.getElementById('errorMsg');

    errEl.textContent = '';

    if (!amount || amount < 1) {
      errEl.textContent = 'Please enter a valid amount.';
      return;
    }

    const btn = document.getElementById('payBtn');
    btn.disabled = true;
    btn.textContent = 'Opening payment…';

    try {
      // 1. Create Razorpay order on our server
      const res  = await fetch('/create-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount, name, message })
      });

      if (!res.ok) throw new Error('Could not create order. Try again.');
      const order = await res.json();

      // 2. Open Razorpay Checkout (shows UPI QR + all payment methods)
      const rzp = new Razorpay({
        key:         CONFIG.razorpayKey !== '__RAZORPAY_KEY__' ? CONFIG.razorpayKey : order.key,
        order_id:    order.id,
        amount:      order.amount,
        currency:    CONFIG.currency,
        name:        streamerName,
        description: message || 'Donation',
        prefill:     { name },
        theme:       { color: '#7C3AED' },
        modal: {
          ondismiss() {
            btn.disabled = false;
            btn.innerHTML = 'Pay via UPI &nbsp;<span class="amount-preview">₹' + amount + '</span>';
          }
        },
        handler(response) {
          // Payment succeeded — show success screen
          // (StreamElements alert fires via Razorpay webhook on server)
          document.getElementById('formView').style.display = 'none';
          const sv = document.getElementById('successView');
          sv.classList.add('visible');
          document.getElementById('successName').textContent = name;
        }
      });

      rzp.open();

    } catch (err) {
      errEl.textContent = err.message;
      btn.disabled = false;
      btn.innerHTML = 'Pay via UPI &nbsp;<span class="amount-preview">₹' + amount + '</span>';
    }
  });

  // ─── Tip again ────────────────────────────────────────────────────────────
  document.getElementById('tipAgainBtn').addEventListener('click', () => {
    document.getElementById('successView').classList.remove('visible');
    document.getElementById('formView').style.display = '';
    document.getElementById('donorName').value = '';
    document.getElementById('donorMsg').value = '';
    document.getElementById('customAmount').value = '';
    document.querySelectorAll('.chip').forEach((c, i) => c.classList.toggle('selected', i === 1));
    updatePreview(99);
  });
</script>
</body>
</html>
