services:
  - type: web
    name: gameday-tip-site
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: SE_CHANNEL_ID
        sync: false
      - key: SE_JWT_TOKEN
        sync: false
      - key: STREAMLABS_ACCESS_TOKEN
        sync: false
      - key: PORT
        value: 3000
